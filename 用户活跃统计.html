<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;background:#f0f2f5;display:flex;height:100vh;overflow:hidden;color:#333}
/* ── Sidebar ── */
.sidebar{width:188px;min-width:188px;background:#1a3a5c;color:#fff;display:flex;flex-direction:column;height:100vh;overflow-y:auto;flex-shrink:0}
.sidebar::-webkit-scrollbar{width:4px}.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}
.sidebar-logo{padding:14px 16px 12px;background:#143050;display:flex;align-items:center;gap:10px;flex-shrink:0}
.sidebar-logo .logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#4096ff,#1677ff);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.sidebar-logo .brand{font-size:14px;font-weight:600;color:#fff;line-height:1.3}
.nav-item{display:flex;align-items:center;gap:8px;padding:11px 16px;cursor:pointer;color:rgba(255,255,255,.78);transition:all .18s;font-size:13px}
.nav-item:hover{background:rgba(64,150,255,.18);color:#fff}
.nav-item.active{background:rgba(64,150,255,.25);color:#fff}
.nav-item.parent{justify-content:space-between}
.nav-item .icon{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.nav-sub{overflow:hidden;max-height:0;transition:max-height .28s ease;background:rgba(0,0,0,.18)}
.nav-sub.open{max-height:600px}
.nav-sub-item{display:block;padding:9px 16px 9px 42px;color:rgba(255,255,255,.62);cursor:pointer;font-size:12px;transition:all .18s}
.nav-sub-item:hover{color:#fff;background:rgba(64,150,255,.15)}
.nav-sub-item.active{color:#69b1ff;background:rgba(64,150,255,.22);font-weight:500}
.arrow{font-size:11px;transition:transform .28s;color:rgba(255,255,255,.45)}
.arrow.open{transform:rotate(90deg)}
/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{background:#fff;padding:0 16px;height:46px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e8e8e8;flex-shrink:0}
.breadcrumb{display:flex;align-items:center;gap:5px;color:#888;font-size:12px}
.breadcrumb .sep{color:#d9d9d9}
.breadcrumb .cur{color:#1677ff}
.topbar-actions{display:flex;align-items:center;gap:10px}
.topbar-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;color:#888;font-size:14px}
.topbar-icon:hover{background:#f0f2f5}
.avatar{width:28px;height:28px;background:#1677ff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;cursor:pointer;font-weight:600}
.tabbar{background:#fff;border-bottom:1px solid #e8e8e8;display:flex;overflow-x:auto;flex-shrink:0;min-height:36px}
.tabbar::-webkit-scrollbar{height:2px}
.tab{display:flex;align-items:center;gap:5px;padding:7px 14px;cursor:pointer;border-right:1px solid #f0f0f0;white-space:nowrap;color:#777;border-bottom:2px solid transparent;flex-shrink:0;font-size:12px}
.tab:hover{background:#fafafa;color:#333}
.tab.active{color:#1677ff;border-bottom-color:#1677ff}
.tab .close-x{font-size:11px;opacity:.45;margin-left:1px;line-height:1}
.tab .close-x:hover{opacity:1;color:#f00}
/* ── Content ── */
.content{flex:1;padding:12px 14px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.card{background:#fff;border-radius:6px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
/* ── Filter ── */
.filter-row{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:6px;flex-shrink:0}
.field label{white-space:nowrap;color:#666;font-size:12px;flex-shrink:0}
.field input,.field select,.field .tree-trigger{height:30px;border:1px solid #d9d9d9;border-radius:4px;padding:0 8px;font-size:12px;outline:none;color:#333;background:#fff;min-width:0}
.field input:focus,.field select:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.field-unit{flex:0 0 auto}.field-unit .tree-trigger{width:180px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:4px;user-select:none}
.field-date input{width:140px}
/* Buttons */
.btn{height:30px;padding:0 14px;border:none;border-radius:4px;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:4px;transition:all .18s;white-space:nowrap}
.btn-primary{background:#1677ff;color:#fff}
.btn-primary:hover{background:#4096ff}
.btn-default{background:#fff;color:#555;border:1px solid #d9d9d9}
.btn-default:hover:not(:disabled){color:#1677ff;border-color:#1677ff}
.btn-reset{background:#fff;color:#666;border:1px solid #d9d9d9}
.btn-reset:hover{background:#f5f5f5}
.btn-export{background:#1890ff;color:#fff}
.btn-export:hover{background:#40a9ff}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* Action bar */
.action-bar{display:flex;gap:8px;margin-bottom:10px;align-items:center}
/* Table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;table-layout:auto}
thead th{background:#f5f8ff;padding:9px 10px;text-align:center;font-weight:600;color:#4a5568;font-size:12px;border-bottom:2px solid #dce8ff;white-space:nowrap;position:sticky;top:0;z-index:2}
tbody td{padding:8px 10px;border-bottom:1px solid #f0f3fa;color:#333;font-size:12px;vertical-align:middle;text-align:center}
tbody tr:hover{background:#f0f6ff}
tbody tr.total-row{background:#fafbfc;font-weight:600}
tbody tr.total-row td{border-top:2px solid #e8e8e8;border-bottom:2px solid #e8e8e8}
tbody td.num{color:#1677ff;cursor:pointer}
tbody td.num:hover{text-decoration:underline}
.cb{width:14px;height:14px;cursor:pointer;accent-color:#1677ff}
/* Group header */
.group-header{background:#f5f8ff;font-weight:600;color:#4a5568}
.group-header th{border-bottom:1px solid #dce8ff}
/* Tree dropdown */
.tree-popup{position:fixed;background:#fff;border:1px solid #d9d9d9;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:2000;padding:6px 0;min-width:220px;max-height:320px;overflow-y:auto;display:none}
.tree-popup.show{display:block}
.tree-node{padding:7px 12px 7px calc(12px + var(--depth)*16px);cursor:pointer;display:flex;align-items:center;gap:5px;font-size:12px;color:#333}
.tree-node:hover{background:#f0f6ff;color:#1677ff}
.tree-node.has-child:hover{background:#fafafa;color:#999}
.tree-node.selected{color:#1677ff;background:#e6f4ff}
.tree-node .t-arrow{font-size:10px;color:#bbb;transition:transform .2s;flex-shrink:0}
.tree-node .t-arrow.open{transform:rotate(90deg)}
.tree-children{overflow:hidden;max-height:0;transition:max-height .2s}
.tree-children.open{max-height:500px}
/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #d9d9d9;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.15);padding:12px 20px;z-index:3000;display:none;align-items:center;gap:10px;font-size:13px}
.toast.show{display:flex;animation:slideDown .3s}
.toast.success{border-color:#52c41a;background:#f6ffed}
@keyframes slideDown{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}
</style>

  html+=`<tr class="total-row">
    <td>${totalRow.seq}</td>
    <td style="text-align:left">${totalRow.name}</td>
    <td>${totalRow.reg.toLocaleString()}</td>
    <td>${totalRow.login.toLocaleString()}</td>
    <td>${totalRow.use.toLocaleString()}</td>
    <td>${totalRow.m1.toLocaleString()}</td>
    <td>${totalRow.m2.toLocaleString()}</td>
    <td>${totalRow.m3.toLocaleString()}</td>
    <td>${totalRow.m4.toLocaleString()}</td>
    <td>${totalRow.m5.toLocaleString()}</td>
    <td>${totalRow.m6.toLocaleString()}</td>
    <td>${totalRow.m7.toLocaleString()}</td>
    <td>${totalRow.year.toLocaleString()}</td>
    <td>${totalRow.fee.toLocaleString()}</td>
    <td>${totalRow.amount.toLocaleString()}</td>
  </tr>`;
  tbody.innerHTML=html;
}

// ══ Tree dropdown ══
let treeOpen=false;
function buildTree(nodes,depth=0){
  return nodes.map(n=>{
    const hasChild=n.children&&n.children.length>0;
    const isOpen=depth<1&&hasChild;
    return `<div>
      <div class="tree-node ${hasChild?'has-child':''}" style="--depth:${depth};${hasChild?'color:#999;cursor:default;':''}" onclick="treeNodeClick('${n.id}','${n.name}',${hasChild},event)">
        ${hasChild?`<span class="t-arrow ${isOpen?'open':''}" id="tarrow-${n.id}">›</span>`:'<span style="width:14px;flex-shrink:0"></span>'}
        <span>${n.name}${hasChild?' (请选择下级单位)':''}</span>
      </div>
      ${hasChild?`<div class="tree-children ${isOpen?'open':''}" id="tchildren-${n.id}">${buildTree(n.children,depth+1)}</div>`:''}
    </div>`;
  }).join('');
}
function treeNodeClick(id,name,hasChild,e){
  e.stopPropagation();
  if(hasChild){
    const ch=document.getElementById('tchildren-'+id);
    const ar=document.getElementById('tarrow-'+id);
    if(ch){ch.classList.toggle('open');ar&&ar.classList.toggle('open');}
  } else {
    document.getElementById('unit-value').value=id;
    const d=document.getElementById('unit-display');
    d.textContent=name;d.style.color='#333';
    closeTree();
  }
}
function toggleTree(e){
  e.stopPropagation();
  const popup=document.getElementById('tree-popup');
  if(!popup.innerHTML){popup.innerHTML=buildTree(orgTree);}
  const trigger=document.getElementById('unit-trigger');
  const rect=trigger.getBoundingClientRect();
  popup.style.top=(rect.bottom+4)+'px';
  popup.style.left=rect.left+'px';
  popup.classList.toggle('show');
  treeOpen=popup.classList.contains('show');
}
function closeTree(){document.getElementById('tree-popup').classList.remove('show');treeOpen=false;}
document.addEventListener('click',e=>{if(treeOpen&&!e.target.closest('#tree-popup')&&!e.target.closest('#unit-trigger'))closeTree();});

// ══ Actions ══
function showToast(msg,type='success'){
  const t=document.getElementById('toast');
  const icon=document.getElementById('toast-icon');
  const msgEl=document.getElementById('toast-msg');
  t.className='toast show '+type;
  icon.textContent=type==='success'?'✓':type==='error'?'✕':'⚠';
  msgEl.textContent=msg;
  setTimeout(()=>t.classList.remove('show'),3000);
}
