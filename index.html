<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>运营管理系统</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;background:#f0f2f5;display:flex;height:100vh;overflow:hidden;color:#333}
/* ── Sidebar ── */
.sidebar{width:188px;min-width:188px;background:#1a3a5c;color:#fff;display:flex;flex-direction:column;height:100vh;overflow-y:auto;flex-shrink:0}
.sidebar::-webkit-scrollbar{width:4px}.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}
.sidebar-logo{padding:14px 16px 12px;background:#143050;display:flex;align-items:center;gap:10px;flex-shrink:0}
.sidebar-logo .logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#4096ff,#1677ff);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.sidebar-logo .brand{font-size:14px;font-weight:600;color:#fff;line-height:1.3}
.nav-item{display:flex;align-items:center;gap:8px;padding:11px 16px;cursor:pointer;color:rgba(255,255,255,.78);transition:all .18s;font-size:13px}
.nav-item:hover{background:rgba(64,150,255,.18);color:#fff}
.nav-item.active{background:rgba(64,150,255,.25);color:#fff}
.nav-item.parent{justify-content:space-between}
.nav-item .icon{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.nav-sub{overflow:hidden;max-height:0;transition:max-height .28s ease;background:rgba(0,0,0,.18)}
.nav-sub.open{max-height:600px}
.nav-sub-item{display:block;padding:9px 16px 9px 42px;color:rgba(255,255,255,.62);cursor:pointer;font-size:12px;transition:all .18s}
.nav-sub-item:hover{color:#fff;background:rgba(64,150,255,.15)}
.nav-sub-item.active{color:#69b1ff;background:rgba(64,150,255,.22);font-weight:500}
.arrow{font-size:11px;transition:transform .28s;color:rgba(255,255,255,.45)}
.arrow.open{transform:rotate(90deg)}
/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{background:#fff;padding:0 16px;height:46px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e8e8e8;flex-shrink:0}
.breadcrumb{display:flex;align-items:center;gap:5px;color:#888;font-size:12px}
.breadcrumb .sep{color:#d9d9d9}
.breadcrumb .cur{color:#1677ff}
.topbar-actions{display:flex;align-items:center;gap:10px}
.topbar-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;color:#888;font-size:14px}
.topbar-icon:hover{background:#f0f2f5}
.avatar{width:28px;height:28px;background:#1677ff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;cursor:pointer;font-weight:600}
/* ── Content ── */
.content{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto}
.hero{text-align:center}
.hero .logo-big{width:80px;height:80px;background:linear-gradient(135deg,#4096ff,#1677ff);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;color:#fff;margin:0 auto 24px;box-shadow:0 8px 24px rgba(22,119,255,.25)}
.hero h1{font-size:36px;font-weight:600;color:#1a3a5c;letter-spacing:4px;margin-bottom:12px}
.hero p{font-size:14px;color:#888;letter-spacing:1px}
</style>
</head>
<body>
<!-- ══ SIDEBAR ══ -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">运</div>
    <div class="brand">运营管理系统</div>
  </div>
          <nav id="nav">
    <div class="nav-item active" onclick="location.href='index.html'"><span class="icon">🏠</span>首页</div>
    <div class="nav-item parent" onclick="toggleNav('product')">
      <span style="display:flex;align-items:center;gap:8px"><span class="icon">📦</span>产品管理</span>
      <span class="arrow" id="arrow-product">›</span>
    </div>
    <div class="nav-sub" id="sub-product">
      <div class="nav-sub-item" onclick="location.href='产品池.html'">产品池</div>
      <div class="nav-sub-item" onclick="location.href='定价维度.html'">定价维度</div>
      <div class="nav-sub-item" onclick="location.href='产品定价.html'">产品定价</div>
      <div class="nav-sub-item" onclick="location.href='产品分配.html'">产品分配</div>
      <div class="nav-sub-item">申请跨区推广</div>
    </div>
    <div class="nav-item parent" onclick="toggleNav('client')">
      <span style="display:flex;align-items:center;gap:8px"><span class="icon">⚙️</span>客户端配置</span>
      <span class="arrow" id="arrow-client">›</span>
    </div>
    <div class="nav-sub" id="sub-client">
      <div class="nav-sub-item" onclick="location.href='客户端配置-一级菜单.html'">一级菜单</div>
      <div class="nav-sub-item">工作台</div>
      <div class="nav-sub-item" onclick="location.href='客户端配置-财税业务.html'">财税业务</div>
      <div class="nav-sub-item">服务培训</div>
      <div class="nav-sub-item">应用市场</div>
      <div class="nav-sub-item">常用工具</div>
    </div>
    <div class="nav-item parent" onclick="toggleNav('equity')">
      <span style="display:flex;align-items:center;gap:8px"><span class="icon">🏢</span>权益配置</span>
      <span class="arrow" id="arrow-equity">›</span>
    </div>
    <div class="nav-sub" id="sub-equity">
      <div class="nav-sub-item" onclick="location.href='权益配置.html'">权益配置</div>
    </div>
    <div class="nav-item parent" onclick="toggleNav('salecfg')">
      <span style="display:flex;align-items:center;gap:8px"><span class="icon">📄</span>销售配置</span>
      <span class="arrow" id="arrow-salecfg">›</span>
    </div>
    <div class="nav-sub" id="sub-salecfg">
      <div class="nav-sub-item">协议模板</div>
      <div class="nav-sub-item" onclick="location.href='支付配置.html'">支付配置</div>
      <div class="nav-sub-item">开票配置</div>
    </div>
    <div class="nav-item parent" onclick="toggleNav('sales')">
      <span style="display:flex;align-items:center;gap:8px"><span class="icon">💰</span>销售中心</span>
      <span class="arrow" id="arrow-sales">›</span>
    </div>
    <div class="nav-sub" id="sub-sales">
      <div class="nav-sub-item" onclick="location.href='订单管理.html'">订单管理</div>
    </div>
    <div class="nav-item parent" onclick="toggleNav('analysis')">
      <span style="display:flex;align-items:center;gap:8px"><span class="icon">📊</span>统计分析</span>
      <span class="arrow" id="arrow-analysis">›</span>
    </div>
    <div class="nav-sub" id="sub-analysis">
      <div class="nav-sub-item" onclick="location.href='一户式视图.html'">一户式视图</div>
      <div class="nav-sub-item" onclick="location.href='活跃度分析.html'">活跃度分析</div>
      <div class="nav-sub-item" onclick="location.href='应用分析.html'">应用分析</div>
      <div class="nav-sub-item" onclick="location.href='销售统计.html'">销售统计</div>
    </div>
    <div class="nav-item"><span class="icon">👥</span>用户中心</div>
    <div class="nav-item"><span class="icon">💬</span>消息中心</div>
  </nav>
</aside>
<!-- ══ MAIN ══ -->
<div class="main">
  <div class="topbar">
    <div class="breadcrumb">
      <span class="cur">首页</span>
    </div>
    <div class="topbar-actions">
      <div class="topbar-icon" title="搜索">🔍</div>
      <div class="topbar-icon" title="帮助">❓</div>
      <div class="topbar-icon" title="全屏">⛶</div>
      <div class="avatar" title="管理员">管</div>
    </div>
  </div>
  <div class="content">
    <div class="hero">
      <div class="logo-big">运</div>
      <h1>运营管理系统</h1>
      <p>Operation Management System</p>
    </div>
  </div>
</div>
<script>
function toggleNav(key){
  const s=document.getElementById('sub-'+key),a=document.getElementById('arrow-'+key);
  s.classList.toggle('open');a.classList.toggle('open');
}
</script>
</body>
</html>
